<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Service</title>
    <!-- css file -->
     <link rel="stylesheet" href="./style.css">
    <!-- daisy ui cdn -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwind cdn -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <div class="max-w-[1250px] mx-auto px-4">

        <!-- nav bar starts here -->

    <div class="flex justify-between">

        <!-- emergency service text +logo -->
        <div class=" flex ml-[60px] gap-2 mt-[25px] mb-[25px] h-[195.2px] w-[50px]">
             <img class="h-[50px] w-[50px]" src="./assets/logo.png" alt="">
             <h2 class="text-[#006747] font-extrabold">Emergency <br> Service</h2>
        </div>

        <!-- buttons -->
        <div class="flex justify-end mt-[24px] mr-[60px] gap-2 p-2">
            
            <!-- heart button -->
           <button class="btn bg-[#EDFFF1] border-[#EDFFF1] rounded-full font-normal gap-2 px-6 "> 
            <h2 class="font-bold text-xl text-black">0</h2>
            <img class="w-[30px] h-[30px]" src="./assets/heart.png" alt="">
           </button>
        
           <!-- coin button -->
           <button class="btn bg-[#EDFFF1] border-[#EDFFF1] rounded-full font-normal gap-2 px-6"> 
            <h2 class="font-bold text-xl text-black">100</h2>
            <img class="w-[30px] h-[30px]" src="./assets/coin.png" alt="">
           </button>

           <!-- copy button -->
           <button class="btn bg-[#00A63E] border-[#00A63E] rounded-full text-white font-normal px-8">
              2 Copy
           </button>
        

        </div>
    </div>
</div>

<script src="./script.js"></script>
</body>
</html>
