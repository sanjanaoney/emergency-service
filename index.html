<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Service</title>
    <!-- css file -->
     <link rel="stylesheet" href="./style.css">
     <!-- font awesome cdn -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- daisy ui cdn -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwind cdn -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <div class="max-w-auto mx-auto my-auto bg-[#F5FFF6]">

        <!-- nav bar starts here -->

    <div class="flex justify-between bg-white">

        <!-- emergency service text +logo -->
       
            <div class="flex ml-[60px] gap-2 mt-[25px] mb-[25px]">
             <img class="h-[50px] w-[50px]" src="./assets/logo.png" alt="">
             <h2 class="text-[#006747] font-extrabold">Emergency <br> Service</h2>
        </div>

        <!-- buttons -->
        <div class="flex justify-end mt-[24px] mr-[60px] gap-2 p-2">
            
            <!-- heart button -->
           <button class="btn bg-[#EDFFF1] border-[#EDFFF1] rounded-full font-normal gap-2 px-6 "> 
            <h2 id="heart-count" class="font-bold text-xl text-black">0</h2>
            <img class="w-[30px] h-[30px]" src="./assets/heart.png" alt="">
           </button>
        
           <!-- coin button -->
           <button class="btn bg-[#EDFFF1] border-[#EDFFF1] rounded-full font-normal gap-2 px-6"> 
            <h2 id="coin-count" class="font-bold text-xl text-black">100</h2>
            <img class="w-[30px] h-[30px]" src="./assets/coin.png" alt="">
           </button>

           <!-- copy button -->
           <button class="btn bg-[#00A63E] border-[#00A63E] rounded-full text-white font-normal px-8">
             <span id="copy-count">0</span> Copy
           </button>
        

        </div>
    </div>

     <!-- hero section starts here -->
<div class="text-center bg-[linear-gradient(to_right,#013223_0%,#006747_50%,#013223_100%)]  flex flex-col items-center justify-center gap-3 py-8 mb-10">
    <img class="h-[92px] w-[92px] " src="./assets/logo-dark.png" alt="">
    <h1 class="text-white font-bold text-3xl">Emergency Service Directory</h1>
    <h2 class="text-white">Government Emergency Services at Your Fingertip – A Project by  Government of the People’s Republic of Bangladesh</h2>
</div>
 


<!-- main section starts here -->

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-5 m-5">
    <!-- <div class="bg-[#F5FFF6] py-8"> -->

    <!-- Cards container -->
     <div class="lg:col-span-3">
    <div  id="card-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 p-1 " >
        

        <!-- JavaScript will generate all the cards here -->

    </div>
    </div>

<!-- </div> -->


<!-- history section starts here -->

<div class="lg:col-span-1">

    <!-- History Header -->
    <div class="bg-white rounded-xl p-5">

        <div class="flex justify-between items-center">

            <div class="flex items-center gap-2">
                <i class="fa-regular fa-clock text-gray-600"></i>

                <h2 class="text-black font-bold">
                    Call History
                </h2>
            </div>

            <button id="clear-history" class="btn bg-[#00A63E] border-[#00A63E] rounded-xl font-normal text-white">
                Clear
            </button>

        </div>

        <!-- History items -->
        <div id="history-container" class="mt-3">
        </div>

    </div>

</div>



</div>


<script src="./script.js"></script>
</body>
</html>
